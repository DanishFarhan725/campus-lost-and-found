[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  # Ship dependencies with the function; the bundle requires express at runtime
  included_files = ["node_modules/**"]

# /api/* and /uploads/* are routed to the function by its own `config.path`
# (see netlify/functions/api.mjs).

# Single-page app: any other unknown path loads the app shell
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
